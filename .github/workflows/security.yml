name: Security and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /api/v1
          VITE_GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.lock --require-hashes --disable-pip
      - run: APP_ENV=production DATABASE_URL=sqlite:////tmp/wtracker-ci.db alembic -c alembic.ini upgrade head

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VITE_GOOGLE_CLIENT_ID=test-client.apps.googleusercontent.com -t wtracker-web .
      - run: docker build -t wtracker-backend backend
